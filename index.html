<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance System - SVSPM Udgir</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDWlyQvWNrSBEtB-SmwtQsktqNuLc86lyQ",
      authDomain: "svspm-attendance.firebaseapp.com",
      databaseURL: "https://svspm-attendance-default-rtdb.firebaseio.com",
      projectId: "svspm-attendance",
      storageBucket: "svspm-attendance.firebasestorage.app",
      messagingSenderId: "50741659848",
      appId: "1:50741659848:web:d741c176dc3b762fd57dfd"
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
  </script>
</head>
<body class="bg-slate-100 min-h-screen">

  <header class="bg-blue-900 text-white p-6 shadow-md text-center">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <img src="logo.png" alt="Logo" class="h-16 w-16 object-contain rounded-full bg-white p-1">
      <div>
        <h1 class="text-2xl font-bold">Swami Vivekanand Mahavidyalaya</h1>
        <p class="text-sm opacity-80">Udgir, Dist. Latur | Smart Student Attendance Portal</p>
      </div>
      <div class="text-right text-xs">
        <p class="font-semibold">Department of Computer Science</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto m-6 p-6 bg-white rounded-xl shadow-lg">
    <!-- Add Student Form -->
    <div class="mb-8 p-4 bg-slate-50 border border-slate-200 rounded-lg">
      <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-user-plus mr-2"></i>Add Student</h3>
      <div class="flex flex-col sm:flex-row gap-4">
        <input type="number" id="rollNo" placeholder="Roll No" class="p-2 border rounded-md w-full sm:w-1/4">
        <input type="text" id="studentName" placeholder="Student Full Name" class="p-2 border rounded-md w-full sm:w-3/4">
        <button onclick="addStudent()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-md transition">
          + Add Student
        </button>
      </div>
    </div>

    <!-- Attendance Table -->
    <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-list-check mr-2"></i>Attendance Sheet</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse border border-slate-200">
        <thead>
          <tr class="bg-slate-200 text-slate-700">
            <th class="p-3 border">Roll No</th>
            <th class="p-3 border">Name</th>
            <th class="p-3 border">Status</th>
            <th class="p-3 border">Action</th>
          </tr>
        </thead>
        <tbody id="studentList">
          <!-- Realtime Data Will Load Here -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // 1. Listen for Realtime Student Updates
    const studentsRef = database.ref('students');
    
    studentsRef.on('value', (snapshot) => {
      const studentList = document.getElementById('studentList');
      studentList.innerHTML = '';
      
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach((key) => {
          const student = data[key];
          studentList.innerHTML += `
            <tr class="border-b hover:bg-slate-50">
              <td class="p-3 border">${student.rollNo}</td>
              <td class="p-3 border font-semibold">${student.name}</td>
              <td class="p-3 border">
                <span class="px-3 py-1 text-xs rounded-full ${student.status === 'Present' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'} font-bold">
                  ${student.status || 'Absent'}
                </span>
              </td>
              <td class="p-3 border">
                <button onclick="toggleAttendance('${key}', '${student.status}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1 rounded">
                  Toggle Status
                </button>
                <button onclick="deleteStudent('${key}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded ml-2">
                  Delete
                </button>
              </td>
            </tr>
          `;
        });
      } else {
        studentList.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">कोणतेही विद्यार्थी उपलब्ध नाहीत. "+ Add Student" वापरा!</td></tr>`;
      }
    });

    // 2. Function to Add Student to Firebase
    function addStudent() {
      const rollNo = document.getElementById('rollNo').value;
      const name = document.getElementById('studentName').value;

      if (rollNo && name) {
        studentsRef.push({
          rollNo: rollNo,
          name: name,
          status: 'Absent'
        });
        document.getElementById('rollNo').value = '';
        document.getElementById('studentName').value = '';
      } else {
        alert('कृपया Roll No आणि Name दोन्ही भरा!');
      }
    }

    // 3. Function to Toggle Attendance
    function toggleAttendance(id, currentStatus) {
      const newStatus = currentStatus === 'Present' ? 'Absent' : 'Present';
      database.ref('students/' + id).update({
        status: newStatus
      });
    }

    // 4. Function to Delete Student
    function deleteStudent(id) {
      if (confirm("खात्री आहे का? विद्यार्थी डिलीट केला जाईल.")) {
        database.ref('students/' + id).remove();
      }
    }
  </script>
</body>
</html>
